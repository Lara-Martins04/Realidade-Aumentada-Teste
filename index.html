<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aedes AR - Ciclo de Vida</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
  
  <!-- Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    /* Reset e Variáveis */
    :root {
      --blue-50: #eff6ff;
      --blue-200: #bfdbfe;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --gray-50: #f9fafb;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --indigo-100: #e0e7ff;
      --indigo-800: #3730a3;
      --amber-100: #fef3c7;
      --amber-900: #78350f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Nunito', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000;
      color: var(--gray-900);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Ocultar scrollbars */
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    /* Fundos */
    #bg-gradient {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, var(--blue-50), var(--blue-200));
      z-index: 0;
      transition: opacity 0.5s ease;
    }

    #webcam {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #webcam.active {
      opacity: 1;
    }

    /* Model Viewer */
    model-viewer {
      position: absolute;
      top: 0; left: 0; width: 100%; 
      height: calc(100% - 240px);
      z-index: 10;
      background-color: transparent;
      transition: height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    model-viewer.ar-mode {
      height: 100%;
    }

    /* Camada de UI */
    #ui-layer {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .pointer-auto { pointer-events: auto; }

    /* Barra Superior */
    #top-bar {
      display: flex;
      justify-content: space-between;
      padding: 16px;
    }

    .btn-icon {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: white;
      border: none;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex; align-items: center; justify-content: center;
      color: var(--gray-700);
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    .btn-icon:active { transform: scale(0.95); }

    .btn-exit-ar {
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      border: none;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex; align-items: center; gap: 8px;
      color: var(--gray-800);
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s;
      display: none;
    }
    .btn-exit-ar:active { transform: scale(0.95); }

    /* Painel Inferior (Modo Normal) */
    #normal-panel {
      background: white;
      border-radius: 24px 24px 0 0;
      padding: 20px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      transform: translateY(0);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #normal-panel.hidden {
      transform: translateY(100%);
      position: absolute;
      bottom: 0; width: 100%;
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
    }
    .panel-header h2 {
      font-size: 12px; font-weight: 900; color: var(--gray-500); letter-spacing: 0.1em;
    }
    
    .btn-primary {
      background: var(--blue-600); color: white;
      padding: 8px 16px; border-radius: 999px; border: none;
      font-size: 12px; font-weight: 800;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 4px 6px -1px rgba(37,99,235,0.3);
      cursor: pointer; transition: transform 0.1s, background 0.2s;
    }
    .btn-primary:active { transform: scale(0.95); }
    .btn-primary:hover { background: var(--blue-700); }

    /* Carrossel de Estágios */
    .stage-carousel {
      display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
    }
    .stage-btn {
      flex-shrink: 0; width: 64px;
      background: var(--gray-50);
      border: 2px solid transparent;
      border-radius: 12px; padding: 8px;
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      cursor: pointer; transition: all 0.2s;
    }
    .stage-btn.active {
      border-color: var(--blue-600); background: var(--blue-50);
    }
    .stage-icon-wrap {
      width: 40px; height: 40px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .stage-btn span {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
    }

    /* Card de Informações */
    .info-card {
      margin-top: 16px; padding: 12px;
      background: var(--gray-50); border-radius: 12px;
    }
    .info-card h3 { font-size: 18px; font-weight: 900; margin-bottom: 4px; }
    .info-card p { font-size: 12px; color: var(--gray-600); line-height: 1.5; margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag {
      padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 800;
    }
    .tag-time { background: var(--indigo-100); color: var(--indigo-800); }
    .tag-curiosity { background: var(--amber-100); color: var(--amber-900); }

    /* Carrossel Modo AR */
    #ar-carousel {
      padding: 0 16px 32px 16px;
      display: none;
      animation: slideUp 0.4s ease forwards;
    }
    #ar-carousel .stage-carousel { justify-content: center; }
    #ar-carousel .stage-btn {
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(4px);
    }
    #ar-carousel .stage-btn.active {
      background: rgba(239, 246, 255, 0.9);
    }

    /* Overlays */
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.9); padding: 12px 24px; border-radius: 999px;
      font-weight: 900; color: var(--blue-600); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
      z-index: 50; display: none;
    }
    #notification {
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: white; padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 800; z-index: 100; text-align: center; max-width: 80%;
      opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    #notification.show { opacity: 1; }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Fundo Normal -->
  <div id="bg-gradient"></div>

  <!-- Fundo Câmera (AR) -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- Visualizador 3D -->
  <model-viewer 
    id="viewer" 
    camera-controls 
    shadow-intensity="1" 
    auto-rotate 
    interaction-prompt="none">
  </model-viewer>

  <!-- Interface de Usuário -->
  <div id="ui-layer">
    
    <!-- Barra Superior -->
    <div id="top-bar" class="pointer-auto">
      <button id="btn-fullscreen" class="btn-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      </button>
      <button id="btn-exit-ar" class="btn-exit-ar">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        Sair do AR
      </button>
    </div>

    <!-- Área Inferior -->
    <div class="pointer-auto">
      
      <!-- Painel Normal -->
      <div id="normal-panel">
        <div class="panel-header">
          <h2>ESTÁGIOS DO CICLO</h2>
          <button id="btn-enter-ar" class="btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            Ver em AR
          </button>
        </div>
        
        <div class="stage-carousel scrollbar-hide" id="normal-carousel">
          <!-- Botões injetados via JS -->
        </div>

        <div class="info-card">
          <h3 id="info-title">Título</h3>
          <p id="info-desc">Descrição</p>
          <div class="tags">
            <span class="tag tag-time" id="info-duration">⏱ Tempo</span>
            <span class="tag tag-curiosity" id="info-curiosity">💡 Curiosidade</span>
          </div>
        </div>
      </div>

      <!-- Carrossel Modo AR -->
      <div id="ar-carousel">
        <div class="stage-carousel scrollbar-hide" id="ar-carousel-inner">
          <!-- Botões injetados via JS -->
        </div>
      </div>

    </div>
  </div>

  <!-- Indicadores -->
  <div id="loading">Carregando modelo 3D...</div>
  <div id="notification"></div>

  <!-- Lógica JavaScript -->
  <script>
    // Dados dos estágios
    const stagesData = {
      ovo: {
        id: 'ovo', title: "Ovo",
        desc: "O mosquito fêmea coloca até 200 ovos em água parada. Os ovos são pretos e minúsculos!",
        duration: "1-3 dias", curiosity: "Resistem até 1 ano secos!",
        modelUrl: "https://raw.githubusercontent.com/Lara-Martins04/Modelos-Aedes/1b633d8210da8470f6577e9c8833e25bae6211c2/ovo.glb",
        icon: "🥚", color: "#F5F5DC"
      },
      larva: {
        id: 'larva', title: "Larva",
        desc: "A larva vive na água e respira na superfície. Ela se alimenta de matéria orgânica.",
        duration: "5-10 dias", curiosity: "Troca de pele 4 vezes antes de virar pupa!",
        modelUrl: "https://raw.githubusercontent.com/Lara-Martins04/Modelos-Aedes/1b633d8210da8470f6577e9c8833e25bae6211c2/larva.glb",
        icon: "🐛", color: "#FFD700"
      },
      pupa: {
        id: 'pupa', title: "Pupa",
        desc: "A pupa não se alimenta. É a fase de transformação — como uma crisálida!",
        duration: "2-3 dias", curiosity: "Em 2 dias, o mosquito adulto emerge da pupa!",
        modelUrl: "https://raw.githubusercontent.com/Lara-Martins04/Modelos-Aedes/1b633d8210da8470f6577e9c8833e25bae6211c2/pupa.glb",
        icon: "🫘", color: "#D2B48C"
      },
      mosquito: {
        id: 'mosquito', title: "Mosquito Adulto",
        desc: "O mosquito adulto vive de 30 a 40 dias. Só a fêmea pica para desenvolver seus ovos.",
        duration: "30-40 dias", curiosity: "Transmite dengue, zika e chikungunya!",
        modelUrl: "https://github.com/Lara-Martins04/Modelos-Aedes/blob/f4a3ede501a66a4e458cb0a38f83a5af4aeb2403/m0squit0.glb",
        icon: "🦟", color: "#A9A9A9"
      }
    };

    let currentStage = 'ovo';
    let isCameraMode = false;
    let notifTimeout;

    // Elementos DOM
    const viewer = document.getElementById('viewer');
    const video = document.getElementById('webcam');
    const bgGradient = document.getElementById('bg-gradient');
    const normalPanel = document.getElementById('normal-panel');
    const arCarousel = document.getElementById('ar-carousel');
    const btnExitAr = document.getElementById('btn-exit-ar');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnEnterAr = document.getElementById('btn-enter-ar');
    const loading = document.getElementById('loading');
    const notification = document.getElementById('notification');
    
    // Elementos de Texto
    const infoTitle = document.getElementById('info-title');
    const infoDesc = document.getElementById('info-desc');
    const infoDuration = document.getElementById('info-duration');
    const infoCuriosity = document.getElementById('info-curiosity');

    // Inicialização
    function init() {
      renderStageButtons('normal-carousel');
      renderStageButtons('ar-carousel-inner');
      setStage('ovo');

      // Eventos do Model Viewer
      viewer.addEventListener('load', () => loading.style.display = 'none');
      viewer.addEventListener('error', () => {
        loading.style.display = 'none';
        showNotification("⚠️ Erro ao carregar o modelo 3D.");
      });
      viewer.addEventListener('click', () => {
        showNotification(`💡 Curiosidade: ${stagesData[currentStage].curiosity}`);
      });

      // Eventos de Botões
      btnEnterAr.addEventListener('click', startCamera);
      btnExitAr.addEventListener('click', stopCamera);
      btnFullscreen.addEventListener('click', toggleFullscreen);
    }

    // Renderizar botões do carrossel
    function renderStageButtons(containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      
      Object.values(stagesData).forEach(stage => {
        const btn = document.createElement('button');
        btn.className = `stage-btn ${stage.id === currentStage ? 'active' : ''}`;
        btn.dataset.id = stage.id;
        btn.onclick = () => setStage(stage.id);
        
        btn.innerHTML = `
          <div class="stage-icon-wrap" style="background-color: ${stage.color}">
            ${stage.icon}
          </div>
          <span>${stage.title}</span>
        `;
        container.appendChild(btn);
      });
    }

    // Atualizar UI para o estágio selecionado
    function setStage(stageId) {
      currentStage = stageId;
      const data = stagesData[stageId];
      
      // Atualizar Modelo
      loading.style.display = 'block';
      viewer.src = data.modelUrl;

      // Atualizar Textos
      infoTitle.textContent = data.title;
      infoDesc.textContent = data.desc;
      infoDuration.textContent = `⏱ ${data.duration}`;
      infoCuriosity.textContent = `💡 ${data.curiosity}`;

      // Atualizar classes ativas nos botões
      document.querySelectorAll('.stage-btn').forEach(btn => {
        if (btn.dataset.id === stageId) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    // Iniciar Câmera (Modo AR)
    async function startCamera() {
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          alert("Acesso à câmera não é suportado neste navegador.");
          return;
        }
        
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        await video.play().catch(e => console.log("Erro ao iniciar vídeo:", e));
        
        isCameraMode = true;
        
        // Atualizar UI
        video.classList.add('active');
        bgGradient.style.opacity = '0';
        viewer.classList.add('ar-mode');
        
        normalPanel.classList.add('hidden');
        setTimeout(() => {
          if(isCameraMode) {
            normalPanel.style.display = 'none';
            arCarousel.style.display = 'block';
          }
        }, 400); // Aguarda animação

        btnExitAr.style.display = 'flex';
        btnFullscreen.style.display = 'none';

      } catch (err) {
        console.warn("Câmera não disponível:", err);
        alert("Não foi possível acessar a câmera. Verifique as permissões.");
      }
    }

    // Parar Câmera (Sair do AR)
    function stopCamera() {
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
      isCameraMode = false;

      // Atualizar UI
      video.classList.remove('active');
      bgGradient.style.opacity = '1';
      viewer.classList.remove('ar-mode');
      
      arCarousel.style.display = 'none';
      normalPanel.style.display = 'block';
      // Forçar reflow para animação
      void normalPanel.offsetWidth;
      normalPanel.classList.remove('hidden');

      btnExitAr.style.display = 'none';
      btnFullscreen.style.display = 'flex';
    }

    // Notificação
    function showNotification(msg) {
      notification.textContent = msg;
      notification.classList.add('show');
      
      clearTimeout(notifTimeout);
      notifTimeout = setTimeout(() => {
        notification.classList.remove('show');
      }, 3000);
    }

    // Tela Cheia
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        document.exitFullscreen();
      }
    }

    // Iniciar app
    init();
  </script>
</body>
</html>
